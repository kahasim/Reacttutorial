    <script type="text/babel">
        // pull useState out of React useState is how react remember things
        const{ useState } = React;

        //a component
        function Counter(){
            //count = current number
            //setCount = (ONLY way to change count)
            const [count, setCount] = useState(0)

            //well describe what the screen should look like
            return(
                //print page to cover for presentation or demonstration
                <div style={{ color: "white", fontSize: "26px", border: "2px solid white", padding: "20px" }}>
                <h1> Count is {count}</h1>
                <p>You have clicked {count} times</p>
               
                <p>Hello. React-counter page using React! <br/>
                Button count is {count}</p>

                <button onClick={() => setCount(count + 1)}>Add one</button>
                <button onClick={() => setCount(0)}>Reset</button>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById("root"))
        root.render(<Counter />)
        //print page to cover for presentation or demonstration
    </script>
</body>
